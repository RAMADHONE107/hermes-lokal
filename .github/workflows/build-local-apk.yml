name: Build Hermes Lokal APK

# Fork-specific workflow. The upstream release.yml expects the maintainer's
# private signing key and exact release tag, so a fork can never use it.
# This one signs with a stable key stored in repository secrets and builds an
# installable arm64 APK that can upgrade earlier builds from this fork.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Make jni native build reproducible
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PUB_CACHE"]) / "hosted/pub.dev/jni-1.0.0/src/CMakeLists.txt"
          append = '\nif (ANDROID)\n\ttarget_link_options(jni PRIVATE "-Wl,--build-id=none")\nendif()\n'
          if '--build-id=none' not in p.read_text():
              with p.open('a') as f:
                  f.write(append)
          print('patched', p)
          PY

      - name: Restore the stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "SIGNING_KEYSTORE_BASE64 is missing" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/local.p12"
          test -s "$GITHUB_WORKSPACE/local.p12"

      - name: Analyze and test
        run: |
          flutter analyze --no-pub --fatal-infos
          flutter test --no-pub

      - name: Build arm64 release APK
        # ARES_PLAY_BUILD disables the upstream GitHub self-updater: this fork
        # must never offer to install the maintainer's differently-signed APK.
        run: flutter build apk --release --split-per-abi --no-pub --dart-define=ARES_PLAY_BUILD=true

      - name: Sign and verify APK
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$apk"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$build_tools/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/local.p12" \
            --ks-type PKCS12 \
            --ks-key-alias hermes-lokal \
            --ks-pass "pass:$SIGNING_KEYSTORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEYSTORE_PASSWORD" \
            --out "$apk.signed" "$apk"
          mv "$apk.signed" "$apk"
          "$build_tools/apksigner" verify --print-certs "$apk" | tee signing-certs.txt
          grep -qi 'certificate DN:' signing-certs.txt
          mv "$apk" hermes-lokal-arm64-v8a.apk
          sha256sum hermes-lokal-arm64-v8a.apk | tee hermes-lokal-arm64-v8a.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-lokal-arm64-v8a
          path: |
            hermes-lokal-arm64-v8a.apk
            hermes-lokal-arm64-v8a.sha256
          retention-days: 30
